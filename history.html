<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سجل الأرشيف والتفتيش التاريخي - مكتب وفاء سيئون</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .archive-controls {
            background: #151f32;
            padding: 15px 20px;
            border-radius: 12px;
            border: 1px solid #334155;
            margin-bottom: 20px;
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            align-items: center;
        }

        .filter-item {
            display: flex;
            flex-direction: column;
            gap: 5px;
            flex: 1;
            min-width: 180px;
        }

        .filter-item label {
            font-size: 0.85rem;
            color: #94a3b8;
            font-weight: 600;
        }

        .filter-item input, .filter-item select {
            background: #1e293b;
            border: 1px solid #334155;
            color: #fff;
            padding: 10px;
            border-radius: 8px;
            outline: none;
        }

        .stats-summary {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }

        .stat-card {
            background: #151f32;
            padding: 15px 20px;
            border-radius: 10px;
            border-right: 4px solid #38bdf8;
        }

        .stat-card h4 {
            margin: 0;
            font-size: 0.85rem;
            color: #94a3b8;
        }

        .stat-card p {
            margin: 5px 0 0 0;
            font-size: 1.5rem;
            font-weight: bold;
            color: #f8fafc;
        }

        .restore-btn {
            background: #0284c7;
            color: #fff;
            border: none;
            padding: 5px 10px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.8rem;
            font-weight: bold;
        }

        .restore-btn:hover { background: #0369a1; }
    </style>
</head>
<body>

    <div class="dashboard-container">
        
        <!-- الترويسة والعودة -->
        <header style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
            <div>
                <h1>📂 سجل الأرشيف والتفتيش التاريخي</h1>
                <p>مراجعة التذاكر والمعاملات المؤرشفة والسابقة لمكتب وفاء سيئون</p>
            </div>
            <button class="back-btn" onclick="window.location.href='index.html'" style="padding: 10px 18px; font-size: 0.95rem;">➔ عودة للوحة الرئيسية</button>
        </header>

        <!-- كروت الإحصائيات السريعة للأرشيف -->
        <div class="stats-summary">
            <div class="stat-card" style="border-right-color: #38bdf8;">
                <h4>إجمالي التذاكر المؤرشفة</h4>
                <p id="stat-tickets">0</p>
            </div>
            <div class="stat-card" style="border-right-color: #10b981;">
                <h4>إجمالي رحلات العمرة السابقة</h4>
                <p id="stat-umrah">0</p>
            </div>
            <div class="stat-card" style="border-right-color: #a855f7;">
                <h4>إجمالي التأشيرات المنتهية</h4>
                <p id="stat-visas">0</p>
            </div>
        </div>

        <!-- أدوات البحث والتصفية المتقدمة -->
        <div class="archive-controls">
            <div class="filter-item">
                <label>نوع المعاملة:</label>
                <select id="archive-category-select" onchange="loadArchiveData()">
                    <option value="tickets">🎟️ أرشيف تذاكر السفر</option>
                    <option value="umrah">🕋 أرشيف معاملات العمرة</option>
                    <option value="visas">🛂 أرشيف التأشيرات والمعاملات</option>
                </select>
            </div>
            <div class="filter-item">
                <label>تفتيش باسم المسافر / رقم الحجز:</label>
                <input type="text" id="archive-search-input" placeholder="🔍 اكتب الاسم أو الـ PNR..." oninput="filterArchiveRows()">
            </div>
            <div class="filter-item">
                <label>تحديد الشهر التاريخي:</label>
                <input type="month" id="archive-month-input" onchange="filterArchiveRows()">
            </div>
        </div>

        <!-- جدول عرض نتائج الأرشيف -->
        <div class="table-holder full-width-table">
            <table id="archive-table">
                <thead>
                    <tr id="archive-table-header">
                        <!-- يتم رسم العناوين ديناميكياً بحسب القسم -->
                    </tr>
                </thead>
                <tbody>
                    <tr><td colspan="6" style="text-align: center; color: #94a3b8; padding: 20px;">جاري تحميل سجلات الأرشيف...</td></tr>
                </tbody>
            </table>
        </div>

    </div>

    <!-- سكريبت البرمجة الخاص بالأرشيف -->
    <script type="module" src="history.js"></script>
</body>
</html>
