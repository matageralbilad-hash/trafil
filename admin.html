<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم والأدمن - مكتب السفريات</title>
    <link rel="stylesheet" href="style.css"> 
    <style>
        .form-group { margin-bottom: 15px; text-align: right; }
        .form-group label { display: block; margin-bottom: 5px; color: #94a3b8; font-weight: 600; }
        .form-group input, .form-group select { 
            width: 100%; padding: 10px; border-radius: 8px; background: #151f32; 
            border: 1px solid #334155; color: #fff; font-size: 0.95rem;
        }
        .form-group input:focus, .form-group select:focus { border-color: #38bdf8; outline: none; }
        .submit-btn { 
            width: 100%; background: #38bdf8; color: #0f172a; border: none; 
            padding: 12px; border-radius: 8px; font-weight: 700; cursor: pointer; font-size: 1rem;
        }
        .submit-btn:hover { background: #0ea5e9; }
        .delete-btn { background: #f43f5e; color: white; border: none; padding: 5px 10px; border-radius: 5px; cursor: pointer; }
        .delete-btn:hover { background: #e11d48; }

        /* ستايل المساعد الذكي */
        .ai-magic-btn { background: linear-gradient(135deg, #3b82f6 0%, #8b5cf6 100%); color: #fff; border: none; padding: 12px 20px; border-radius: 8px; font-size: 1.1rem; font-weight: bold; cursor: pointer; width: 100%; margin-bottom: 20px; box-shadow: 0 4px 15px rgba(59, 130, 246, 0.4); transition: transform 0.2s; }
        .ai-magic-btn:hover { transform: translateY(-2px); }
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 1000; display: flex; align-items: center; justify-content: center; }
        .ai-modal { background: #0f172a; width: 90%; max-width: 500px; border-radius: 12px; overflow: hidden; border: 1px solid #334155; }
    </style>
</head>
<body>

    <div class="dashboard-container">
        <header style="display: flex; justify-content: space-between; align-items: center;">
            <div>
                <h1>⚙️ لوحة إدارة الحجوزات والأدمن</h1>
                <p>إدخال التذاكر، تأشيرات العمرة، وإدارة النظام مباشر عبر Firebase</p>
            </div>
            <button class="back-btn" onclick="window.location.href='index.html'" style="padding: 10px 18px; font-size: 0.95rem;">➔ عودة للوحة الرئيسية</button>
        </header>

        <!-- الزر السحري للذكاء الاصطناعي -->
        <button type="button" class="ai-magic-btn" onclick="openAIModal()">
            ✨ تعبئة سريعة وذكية بالذكاء الاصطناعي (نص / صورة) 🤖
        </button>

        <!-- شريط التنقل بين الأقسام -->
        <nav class="tabs-navigation">
            <button class="tab-btn active" onclick="switchTab('add-ticket-section')">🎟️ إضافة تذكرة</button>
            <button class="tab-btn" onclick="switchTab('add-umrah-section')">🕋 تأشيرات العمرة</button>
            <button class="tab-btn" onclick="switchTab('add-visa-section')">🛂 إضافة تأشيرة أخرى</button>
        </nav>

        <!-- 1️⃣ قسم إضافة تذكرة -->
        <section id="add-ticket-section" class="tab-content active-content">
            <form id="ticket-form">
                <div class="form-group">
                    <label>اسم صاحب التذكرة</label>
                    <input type="text" id="passenger_name" placeholder="الاسم الكامل للمسافر" required>
                </div>
                <div class="form-group">
                    <label>رقم الحجز (PNR)</label>
                    <input type="text" id="booking_code" placeholder="مثال: XZ98LL" required>
                </div>
                <div class="form-group">
                    <label>تاريخ ووقت الاقلاع</label>
                    <input type="datetime-local" id="departure_date" required>
                </div>
                <div class="form-group">
                    <label>من (مدينة الإقلاع)</label>
                    <input type="text" id="from_location" required placeholder="مثال: سيئون">
                </div>
                <div class="form-group">
                    <label>إلى (الوجهة)</label>
                    <input type="text" id="to_location" placeholder="مثال: جدة">
                </div>
                <div class="form-group">
                    <label>تاريخ ووقت العودة (اتركه فارغاً إذا كان ذهاب فقط)</label>
                    <input type="datetime-local" id="return_date">
                </div>
                <div class="form-group">
                    <label>الوكيل (تعبئة يدوية)</label>
                    <input type="text" id="source" placeholder="مثال: مكتب سيئون الرئيسي / منصة B2B">
                </div>
                <div class="form-group">
                    <label>الجهة / الشركة الناقلة (تعبئة يدوية)</label>
                    <select id="destination_agency" required>
                        <option value="">-- اختر الشركة الناقلة --</option>
                        <option value="عالم الطويلة">عالم الطويلة</option>
                        <option value="عرب سكاي">عرب سكاي</option>
                        <option value="العربية">العربية</option>
                        <option value="شركات أخرى">شركات أخرى</option>
                    </select>
                </div>
                <button type="submit" class="submit-btn">💾 حفظ التذكرة في النظام</button>
            </form>
        </section>

        <!-- 2️⃣ قسم إضافة عمرة -->
        <section id="add-umrah-section" class="tab-content">
            <form id="umrah-form">
                <div class="form-group">
                    <label>اسم المعتمر</label>
                    <input type="text" id="pilgrim_name" placeholder="الاسم الكامل للمعتمر" required>
                </div>
                <div class="form-group">
                    <label>تاريخ الدخول</label>
                    <input type="date" id="entry_date">
                </div>
                <div class="form-group">
                    <label>تاريخ الخروج</label>
                    <input type="date" id="exit_date">
                </div>
                <div class="form-group">
                    <label>النوع (وسيلة السفر)</label>
                    <select id="travel_type">
                        <option value="">-- اختر النوع --</option>
                        <option value="جو">جو ✈️</option>
                        <option value="بر">بر 🚌</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>المستفيد (تعبئة يدوية)</label>
                    <input type="text" id="beneficiary" placeholder="اسم الجهة المستفيدة">
                </div>
                <div class="form-group">
                    <label>الجهة التابع لها المعاملة (تعبئة يدوية)</label>
                    <select id="agency_type" required>
                        <option value="">-- اختر الجهة --</option>
                        <option value="إحرام">إحرام</option>
                        <option value="العمودي">العمودي</option>
                        <option value="سنابل الخير">سنابل الخير</option>
                    </select>
                </div>
                <button type="submit" class="submit-btn" style="background: #10b981;">🕋 حفظ معاملة العمرة</button>
            </form>
        </section>

        <!-- 3️⃣ قسم إضافة تأشيرة جديدة -->
        <section id="add-visa-section" class="tab-content">
            <form id="visa-form">
                <div class="form-group">
                    <label>الاسم</label>
                    <input type="text" id="visa_name" placeholder="الاسم الكامل للمتقدم" required>
                </div>
                <div class="form-group">
                    <label>تاريخ صلاحية التأشيرة</label>
                    <input type="date" id="visa_expiry_date">
                </div>
                <div class="form-group">
                    <label>نوع التأشيرة</label>
                    <select id="visa_type" required>
                        <option value="">-- اختر نوع التأشيرة --</option>
                        <option value="موافقة أمنية">موافقة أمنية 🛡️</option>
                        <option value="مرور عمان">مرور عمان 🇴🇲</option>
                        <option value="تأشيرات أخرى">تأشيرات أخرى 📄</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>المصدر (تعبئة يدوية)</label>
                    <input type="text" id="visa_source" required placeholder="مثال: السفارة / المنصة / المُنقّح">
                </div>
                <div class="form-group">
                    <label>الوكيل (تعبئة يدوية)</label>
                    <input type="text" id="visa_agent" required placeholder="اسم الوكيل المسؤول">
                </div>
                <button type="submit" class="submit-btn" style="background: #a855f7; color: #fff;">🛂 حفظ التأشيرة في النظام</button>
            </form>
        </section>

    </div>

    <!-- نافذة الذكاء الاصطناعي المنبثقة -->
    <div id="aiWizardModal" class="modal-overlay" style="display: none;">
        <div class="modal-content ai-modal">
            <div class="modal-header" style="background: linear-gradient(135deg, #a855f7, #3b82f6); padding: 15px; display: flex; justify-content: space-between; align-items: center;">
                <h3 style="margin: 0; color: white;">🤖 المساعد الذكي (Gemini)</h3>
                <button class="close-modal" onclick="closeAIModal()" style="background: transparent; border: none; color: white; font-size: 1.5rem; cursor: pointer;">&times;</button>
            </div>
            <div class="modal-body" style="padding: 20px; text-align: right;">
                <p style="color: #94a3b8; font-size: 0.9rem; margin-bottom: 15px;">قم بلصق نص الحجز من الواتساب هنا، أو ارفع صورة التذكرة/التأشيرة ليتم تفريغها تلقائياً بالذكاء الاصطناعي.</p>
                
                <textarea id="ai-text-input" placeholder="انسخ نص الرسالة هنا..." style="width: 100%; height: 120px; background: #1e293b; color: #fff; border: 1px solid #334155; border-radius: 8px; padding: 10px; margin-bottom: 15px; outline: none;"></textarea>
                
                <div style="margin-bottom: 20px;">
                    <label style="display: block; margin-bottom: 5px; color: #38bdf8; font-size: 0.9rem; font-weight: bold;">أو قم برفع صورة واضحة (اختياري):</label>
                    <input type="file" id="ai-image-input" accept="image/*" style="width: 100%; background: #1e293b; color: #fff; padding: 8px; border-radius: 8px; border: 1px dashed #38bdf8;">
                </div>

                <div id="ai-loading" style="display: none; text-align: center; color: #10b981; font-weight: bold; margin-bottom: 15px; font-size: 0.95rem;">
                    ⏳ جاري القراءة والتحليل... الرجاء الانتظار
                </div>

                <button type="button" onclick="processAI()" style="width: 100%; background: #10b981; color: white; padding: 12px; border: none; border-radius: 8px; font-weight: bold; font-size: 1rem; cursor: pointer;">
                    🚀 قراءة وتعبئة الخانات
                </button>
            </div>
        </div>
    </div>

    <script>
        function switchTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active-content'));
            document.querySelectorAll('.tabs-navigation .tab-btn').forEach(btn => btn.classList.remove('active'));
            
            document.getElementById(tabId).classList.add('active-content');
            if(window.event && window.event.currentTarget) {
                window.event.currentTarget.classList.add('active');
            }
        }
    </script>

    <!-- استدعاء ملف الـ JS كـ Module للربط المباشر مع Firebase -->
    <script type="module" src="admin.js"></script>
</body>
</html>
